# Automatic releases: the ONLY way this mod ships.
#
# How to release (maintainer):
#   1. Bump `version=` in gradle.properties (must match the tag below).
#   2. Commit + push to main.
#   3. Tag and push the tag:  git tag 1.2.3 ; git push origin 1.2.3
#      (this repo tags plain versions: 1.1.0, 1.2.0, 1.3.0 — no "v").
#   4. This workflow builds from the tagged source and attaches the jars
#      to a GitHub Release. Users download from the Releases page — never
#      a locally built jar, so the "not a RAT" story stays airtight.
#
# Tag format: <gradle.properties version>, e.g. 1.3.0.

name: release
on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: create GitHub release with jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/libs/*.jar
